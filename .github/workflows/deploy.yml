name: Публикация сайта

# Сайт пересобирается и публикуется сам при каждом изменении в ветке main.
# Это значит, что текст можно править прямо на сайте github.com, без установки
# чего-либо на компьютер: изменили content.json, нажали «Commit» — через пару
# минут сайт обновился.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Без cache: npm — кэширование требует package-lock.json, а его нет
      # по той же причине, по которой ниже стоит npm install вместо npm ci.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install, а не npm ci: файла package-lock.json нет, потому что
      # Node.js на компьютере не установлен и зависимости локально не ставились.
      - run: npm install
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
