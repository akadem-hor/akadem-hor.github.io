<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Хор Голоса">
  <!--
    Знак хора: строчная «а» с ударением — та самая буква из названия.
    Значок вкладки рисуется без веб-шрифтов, поэтому Playfair здесь недоступен:
    буква берётся из Georgia, она есть почти везде и близка по рисунку.
    Ударение нарисовано отдельной чёрточкой, а не символом, — так оно встаёт
    ровно на любом устройстве и не зависит от того, как шрифт обрабатывает
    сочетание буквы со знаком.
  -->
  <rect width="64" height="64" fill="#7a5220"/>
  <rect x="29.5" y="10" width="5.5" height="13" rx="1" transform="rotate(22 32 16)" fill="#f7f4ec"/>
  <text x="32" y="49"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'PT Serif', serif"
        font-size="44"
        fill="#f7f4ec">а</text>
</svg>
